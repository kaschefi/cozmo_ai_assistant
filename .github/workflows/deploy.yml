name: MoKa DevOps - Build & Deploy to Azure Container Apps

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Log in to Azure Container Registry (ACR)
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 4. Build and Push Unified Container Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.prod
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/moka-app:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/moka-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 5. Azure CLI Authentication
        if: "${{ secrets.AZURE_CREDENTIALS != '' }}"
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 6. Deploy Revision to Azure Container Apps
        if: "${{ secrets.AZURE_CREDENTIALS != '' }}"
        uses: azure/container-apps-deploy-action@v2
        with:
          acrName: ${{ secrets.ACR_NAME }}
          containerAppName: ${{ secrets.CONTAINER_APP_NAME || 'moka-ai-assistant' }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP || 'moka-cloud-rg' }}
          imageToDeploy: ${{ secrets.ACR_LOGIN_SERVER }}/moka-app:${{ github.sha }}
