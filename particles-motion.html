<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Particle Eyes · Motion Film (60 FPS)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;600;700&display=swap">
<style>
  :root {
    --ground: #ffffff;
    --main: #111111;
    --second: #111112;
    --accent: #767676;
    color: var(--second);
    font-family: 'Arimo', Helvetica, Arial, sans-serif;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0c0c0e;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  #viewport {
    position: relative;
    width: 100vw;
    height: calc(100vh - 60px);
    max-width: 1920px;
    max-height: 1080px;
    aspect-ratio: 16 / 9;
    box-shadow: 0 24px 80px rgba(0,0,0,0.85);
    overflow: hidden;
    background: var(--ground);
  }
  #stage {
    position: absolute;
    left: 0;
    top: 0;
    width: 1920px;
    height: 1080px;
    transform-origin: 0 0;
    overflow: hidden;
    --sans: 'Arimo', Helvetica, Arial, sans-serif;
  }
  .ground { position: absolute; inset: 0; background: var(--ground); }
  .dw-cam { position: absolute; left: 0; top: 0; width: 1900px; height: 1060px; transform-origin: 0 0; }
  .dw-svg { position: absolute; left: 0; top: 0; overflow: visible; --u: 1; }
  .dw-svg text { font-family: var(--sans, system-ui, sans-serif); text-transform: uppercase; }
  .dw-svg .border { fill: none; stroke: var(--main); stroke-width: 1.2; }
  .dw-svg .obj { fill: var(--ground); stroke: var(--main); stroke-width: calc(1.6px * var(--u)); stroke-linejoin: round; }
  .dw-svg .well { fill: color-mix(in srgb, var(--second) 5%, var(--ground)); stroke: var(--main); stroke-width: calc(1px * var(--u)); }
  .dw-svg .hug { fill: color-mix(in srgb, var(--second) 10%, var(--ground)); stroke: var(--main); stroke-width: calc(1px * var(--u)); }
  .dw-svg .slot { fill: none; stroke: color-mix(in srgb, var(--second) 75%, var(--ground)); stroke-width: calc(.8px * var(--u)); stroke-dasharray: calc(4px * var(--u)) calc(3px * var(--u)); }
  .dw-svg .thin { fill: none; stroke: var(--main); stroke-width: calc(.8px * var(--u)); }
  .dw-svg .ph { fill: none; stroke: var(--accent); stroke-width: calc(.8px * var(--u)); stroke-dasharray: calc(14px * var(--u)) calc(3px * var(--u)) calc(3px * var(--u)) calc(3px * var(--u)); }
  .dw-svg .cl { fill: none; stroke: var(--accent); stroke-width: .7; stroke-dasharray: 16 3 2 3; }
  .dw-svg .dl, .dw-svg .lead { stroke: var(--main); stroke-width: .7; fill: none; }
  .dw-svg .ext { stroke: var(--main); stroke-width: .55; fill: none; }
  .dw-svg .arrow, .dw-svg .dot { fill: var(--main); }
  .dw-svg .hl { stroke: color-mix(in srgb, var(--second) 70%, var(--ground)); stroke-width: .7; }
  .dw-svg .hs { stroke: var(--main); stroke-width: calc(.8px * var(--u)); }
  .dw-svg .env { fill: none; stroke: var(--main); stroke-width: .8; stroke-dasharray: 10 3 2 3; }
  .dw-svg .nb { fill: var(--ground); stroke: var(--main); stroke-width: .9; }

  /* Bottom Player Toolbar */
  #player-bar {
    width: 100%;
    max-width: 1920px;
    height: 56px;
    background: #141418;
    border-top: 1px solid rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    box-sizing: border-box;
    color: #e2e8f0;
    font-size: 13px;
    font-family: 'Arimo', sans-serif;
    z-index: 100;
  }
  .p-btn {
    background: #222228;
    border: 1px solid rgba(255,255,255,0.15);
    color: #ffffff;
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s;
  }
  .p-btn:hover { background: #2f2f38; border-color: rgba(255,255,255,0.3); }
  .scrubber-wrap {
    flex: 1;
    margin: 0 24px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  input[type=range] {
    flex: 1;
    height: 5px;
    accent-color: #38bdf8;
    cursor: pointer;
  }
  .badge-beat {
    font-family: monospace;
    font-size: 11px;
    color: #94a3b8;
    background: rgba(255,255,255,0.06);
    padding: 4px 10px;
    border-radius: 6px;
    border: 1px solid rgba(255,255,255,0.08);
  }
</style>
</head>
<body>

<div id="viewport">
  <div id="stage"></div>
</div>

<div id="player-bar">
  <div style="display:flex; align-items:center; gap:10px;">
    <button id="btn-play" class="p-btn">
      <span id="play-icon">❚❚</span> <span id="play-text">PAUSE</span>
    </button>
    <button id="btn-restart" class="p-btn">↺ RESET</button>
  </div>

  <div class="scrubber-wrap">
    <span id="time-display" style="font-family:monospace; min-width:44px; color:#cbd5e1;">0.0s</span>
    <input id="scrubber" type="range" min="0" max="11" step="0.016" value="0">
    <span style="font-family:monospace; color:#64748b;">11.0s</span>
  </div>

  <div style="display:flex; align-items:center; gap:12px;">
    <span id="beat-label" class="badge-beat">BEAT 1 · LEFT EYE APERTURE</span>
    <button id="btn-speed" class="p-btn">1.0×</button>
  </div>
</div>

<script>
(function() {
  const clamp01 = x => Math.max(0, Math.min(1, x));
  const seg = (t, a, b) => clamp01((t - a) / (b - a));
  const lerp = (a, b, p) => a + (b - a) * p;
  const eo = x => 1 - Math.pow(1 - x, 3);
  const ei = x => x * x * x;
  const eio = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);

  const stage = document.getElementById('stage');
  const viewport = document.getElementById('viewport');

  function resizeStage() {
    const vw = viewport.clientWidth || 1920;
    const vh = viewport.clientHeight || 1080;
    const scale = Math.min(vw / 1920, vh / 1080);
    stage.style.transform = `scale(${scale})`;
    stage.style.left = `${(vw - 1920 * scale) / 2}px`;
    stage.style.top = `${(vh - 1080 * scale) / 2}px`;
  }
  window.addEventListener('resize', resizeStage);
  resizeStage();

  var kit = {
    seg, lerp, eo, ei, eio, clamp01, stage,
    width: 1920, height: 1080,
    h: s => { const d = document.createElement('div'); d.innerHTML = s.trim(); return d.firstElementChild; },
    css: s => { const st = document.createElement('style'); st.textContent = s; stage.appendChild(st); },
    scene: (id, o) => { window.SC = o; }
  };

  /* ==================== SCENE DEFINITION ==================== */
  const DW_NS = 'http://www.w3.org/2000/svg';
  const DW_CAM = [
    { t: 0,   cx: 852, cy: 304, z: 4.4 },
    { t: 2.2, cx: 858, cy: 306, z: 4.2 },
    { t: 4.2, cx: 968, cy: 304, z: 1.75 },
    { t: 5.3, cx: 972, cy: 306, z: 1.71 },
    { t: 7.2, cx: 340, cy: 660, z: 1.55 },
    { t: 7.8, cx: 344, cy: 662, z: 1.52 },
    { t: 9.2, cx: 950, cy: 530, z: 0.998 },
    { t: 13,  cx: 950, cy: 530, z: 0.988 }
  ];

  kit.scene('drawing', {
    init(kit) {
      kit.css(
        '.dw-svg .dt{font-size:11px;fill:var(--main);paint-order:stroke;stroke:var(--ground);stroke-width:4px;stroke-linejoin:round}' +
        '.dw-svg .dts{font-size:9.5px;fill:color-mix(in srgb,var(--second) 75%,var(--ground));letter-spacing:.06em;paint-order:stroke;stroke:var(--ground);stroke-width:3px}' +
        '.dw-svg .sl{font-size:9px;fill:color-mix(in srgb,var(--second) 75%,var(--ground));letter-spacing:.08em}' +
        '.dw-svg .nt{font-size:11.5px;fill:var(--main);letter-spacing:.06em}.dw-svg .nth{font-size:13px;font-weight:700;fill:var(--main);letter-spacing:.06em}' +
        '.dw-svg .vt{font-size:12px;fill:var(--main);letter-spacing:.1em}.dw-svg .nbt{font-size:9.5px;fill:var(--main)}' +
        '.dw-svg .th{font-size:10.5px;fill:var(--main);letter-spacing:.05em}.dw-svg .tc{font-size:10.5px;fill:var(--main);text-transform:none}'
      );

      const root = kit.h('<div class="ground"><div class="dw-cam"></div></div>');
      kit.stage.append(root);
      const camEl = root.querySelector('.dw-cam');
      this.cam = camEl.style;

      const svg = document.createElementNS(DW_NS, 'svg');
      svg.setAttribute('viewBox', '0 0 1900 1060');
      svg.setAttribute('width', '1900');
      svg.setAttribute('height', '1060');
      svg.setAttribute('class', 'dw-svg');
      camEl.appendChild(svg);

      const REG = this.reg = [];
      let sv = svg, CUR = { a: 0, s: 0, d: .6, i: 0 }, noreg = 0;
      const at = (a, s, d) => { CUR = { a: a, s: s || 0, d: d || .6, i: 0 }; };
      
      const kind = (e, t) => {
        if (t === 'text') return 'f';
        const c = ' ' + (e.getAttribute('class') || '') + ' ';
        if (/ (slot|ph|cl|env|hs) /.test(c) || (e.getAttribute('fill') || '').indexOf('url') === 0) return 'f';
        return 'd';
      };

      function mk(t, a, p) {
        const e = document.createElementNS(DW_NS, t);
        for (const k in a) if (a[k] != null) e.setAttribute(k, a[k]);
        (p || sv).appendChild(e);
        if (!noreg && t !== 'g') {
          const s = CUR.a + CUR.i * CUR.s;
          CUR.i++;
          const k = kind(e, t);
          if (k === 'd') e.setAttribute('pathLength', '1');
          e.style.opacity = 0;
          REG.push({ e: e, a: s, b: s + CUR.d, k: k, last: -1 });
        }
        return e;
      }

      function tx(x, y, s, c, a, p) {
        const t = mk('text', Object.assign({ x: x, y: y, class: c || 'dt' }, a || {}), p);
        t.textContent = s;
        return t;
      }

      noreg = 1;
      const d = mk('defs', {});
      const m = mk('marker', { id: 'dwar', viewBox: '0 0 10 10', refX: 10, refY: 5, markerWidth: 7, markerHeight: 7, orient: 'auto-start-reverse', markerUnits: 'userSpaceOnUse' }, d);
      mk('path', { d: 'M0,1.7 L10,5 L0,8.3 z', class: 'arrow' }, m);
      const pt = mk('pattern', { id: 'dwhat', width: 5, height: 5, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, d);
      mk('line', { x1: 0, y1: 0, x2: 0, y2: 5, class: 'hl' }, pt);
      noreg = 0;

      const A = 'url(#dwar)', HAT = 'url(#dwhat)';

      function dimH(x1, x2, y, e1, e2, l, o) {
        o = o || {};
        [[x1, e1], [x2, e2]].forEach(([x, e]) => {
          if (e == null) return;
          const s = Math.sign(y - e) || 1;
          mk('line', { x1: x, y1: e + s * 3, x2: x, y2: y + s * 5, class: 'ext' });
        });
        if (x2 - x1 >= 28) {
          mk('line', { x1: x1, y1: y, x2: x2, y2: y, class: 'dl', 'marker-start': A, 'marker-end': A });
        } else {
          mk('line', { x1: x1 - 13, y1: y, x2: x1, y2: y, class: 'dl', 'marker-end': A });
          mk('line', { x1: x2 + 13, y1: y, x2: x2, y2: y, class: 'dl', 'marker-end': A });
        }
        tx((x1 + x2) / 2 + (o.dx || 0), (o.below ? y + 13 : y - 4) + (o.dy || 0), l, o.c || 'dt', { 'text-anchor': 'middle' });
      }

      function dimV(y1, y2, x, e1, e2, l, o) {
        o = o || {};
        [[y1, e1], [y2, e2]].forEach(([y, e]) => {
          if (e == null) return;
          const s = Math.sign(x - e) || 1;
          mk('line', { x1: e + s * 3, y1: y, x2: x + s * 5, y2: y, class: 'ext' });
        });
        if (y2 - y1 >= 28) {
          mk('line', { x1: x, y1: y1, x2: x, y2: y2, class: 'dl', 'marker-start': A, 'marker-end': A });
        } else {
          mk('line', { x1: x, y1: y1 - 13, x2: x, y2: y1, class: 'dl', 'marker-end': A });
          mk('line', { x1: x, y1: y2 + 13, x2: x, y2: y2, class: 'dl', 'marker-end': A });
        }
        const c = (y1 + y2) / 2;
        if (o.side) {
          const r = o.side === 'r';
          tx(r ? x + 6 : x - 6, c + 4 + (o.dy || 0), l, o.c || 'dt', { 'text-anchor': r ? 'start' : 'end' });
        } else {
          tx(x - 5, c, l, o.c || 'dt', { 'text-anchor': 'middle', transform: 'rotate(-90 ' + (x - 5) + ' ' + c + ')' });
        }
      }

      function rad(cx, cy, r, c, l, L) {
        const sx = c.indexOf('l') > -1 ? -1 : 1, sy = c.indexOf('t') > -1 ? -1 : 1;
        const ox = cx - sx * r, oy = cy - sy * r;
        const px = ox + sx * r * Math.SQRT1_2, py = oy + sy * r * Math.SQRT1_2;
        const ex = px + sx * L, ey = py + sy * L;
        mk('circle', { cx: px, cy: py, r: 1.8, class: 'dot' });
        mk('polyline', { points: px + ',' + py + ' ' + ex + ',' + ey + ' ' + (ex + sx * 10) + ',' + ey, class: 'lead' });
        tx(ex + sx * 14, ey + 4, l, 'dt', { 'text-anchor': sx > 0 ? 'start' : 'end' });
      }

      function nb(x, y, n) {
        mk('rect', { x: x - 6, y: y - 6, width: 12, height: 12, class: 'nb' });
        tx(x, y + 3.5, String(n), 'nbt', { 'text-anchor': 'middle' });
      }

      function rr(x, y, w, h, r, c, p) {
        return mk('rect', { x: x, y: y, width: w, height: h, rx: r, class: c }, p);
      }

      function slotLabel(x, y, w, h, l, al, p) {
        tx(al === 'l' ? x + 6 : x + w / 2, y + h / 2 + 3.2, l, 'sl', { 'text-anchor': al === 'l' ? 'start' : 'middle' }, p);
      }

      function title(x, y, t, s) {
        tx(x, y, t, 'vt', { 'text-anchor': 'middle' });
        if (s) tx(x, y + 14, s, 'dts', { 'text-anchor': 'middle' });
      }

      function detailRef(cx, cy, r, lbl, lx, ly) {
        mk('circle', { cx: cx, cy: cy, r: r, class: 'ph' });
        const a = Math.atan2(ly - cy, lx - cx);
        mk('line', { x1: cx + r * Math.cos(a), y1: cy + r * Math.sin(a), x2: lx, y2: ly, class: 'lead' });
        tx(lx + (lx < cx ? -4 : 4), ly + 4, lbl, 'dts', { 'text-anchor': lx < cx ? 'end' : 'start' });
      }

      function table(x, y, ttl, rows) {
        const ws = [42, 92, 106], rh = 16;
        tx(x, y - 7, ttl, 'vt');
        [['Code', 'Variable', 'Value']].concat(rows).forEach((r, i) => {
          let c2 = x;
          r.forEach((c, j) => {
            mk('rect', { x: c2, y: y + i * rh, width: ws[j], height: rh, class: 'thin' });
            tx(c2 + (j ? ws[j] / 2 : 5), y + i * rh + 11.5, c, i ? 'tc' : 'th', { 'text-anchor': j ? 'middle' : 'start' });
            c2 += ws[j];
          });
        });
        return y + (rows.length + 1) * rh + 28;
      }

      function notes(list) {
        tx(50, 58, 'Notes:', 'nth');
        tx(112, 58, '(unless otherwise specified)', 'nt');
        list.forEach(([n, t], i) => {
          const y = 84 + i * 22;
          nb(56, y - 4, n);
          tx(72, y, t, 'nt');
        });
      }

      // Geometry constants (1200 x 600 canvas scaled to plan view)
      const CW = 1200, CH = 600, EW = 240, EH = 240, ER = 40;
      const LX = 280, RX = 680, EY = 180;
      const k = 0.58, PX = 620, PY = 130;
      const X = v => PX + v * k, Y = v => PY + v * k;

      /* ---------- BEAT 1: CLOSE-UP ON LEFT EYE APERTURE (0 to 2.2s) ---------- */
      at(-0.8, 0, 2.2);
      {
        const x0 = X(LX), y0 = Y(EY), w = EW * k, h = EH * k, q = ER * k;
        mk('path', {
          d: 'M' + x0 + ',' + (y0 + q) + ' A' + q + ',' + q + ' 0 0 1 ' + (x0 + q) + ',' + y0 + ' H' + (x0 + w - q) + ' A' + q + ',' + q + ' 0 0 1 ' + (x0 + w) + ',' + (y0 + q) + ' V' + (y0 + h - q) + ' A' + q + ',' + q + ' 0 0 1 ' + (x0 + w - q) + ',' + (y0 + h) + ' H' + (x0 + q) + ' A' + q + ',' + q + ' 0 0 1 ' + x0 + ',' + (y0 + h - q) + ' Z',
          class: 'obj'
        });
      }

      at(0.4, 0.1, 0.8);
      const LCX = LX + EW / 2, CCY = EY + EH / 2;
      mk('line', { x1: X(LCX), y1: Y(EY - 25), x2: X(LCX), y2: Y(EY + EH + 25), class: 'cl' });
      mk('line', { x1: X(LX - 25), y1: Y(CCY), x2: X(LX + EW + 25), y2: Y(CCY), class: 'cl' });

      at(0.9, 0.08, 0.5);
      for (let y = EY + 24; y < EY + EH - 20; y += 24) {
        mk('line', { x1: X(LX + 14), y1: Y(y), x2: X(LX + EW - 14), y2: Y(y), class: 'thin', opacity: .45 });
      }

      const ty = Y(EY - 28);
      at(1.5, 0.08, 0.5);
      dimH(X(LX), X(LX + EW), ty, Y(EY), Y(EY), 'W_eye = 240');
      dimV(Y(EY), Y(EY + EH), X(LX - 36), X(LX), X(LX), 'H_eye = 240');
      rad(X(LX), Y(EY), ER * k, 'tl', 'R_eye = 40', 20);

      /* ---------- BEAT 2: PULL-BACK TO DUAL EYE PLAN VIEW (2.2 to 4.2s) ---------- */
      at(2.2, 0, 1.8);
      {
        const x0 = X(RX), y0 = Y(EY), w = EW * k, h = EH * k, q = ER * k;
        mk('path', {
          d: 'M' + x0 + ',' + (y0 + q) + ' A' + q + ',' + q + ' 0 0 1 ' + (x0 + q) + ',' + y0 + ' H' + (x0 + w - q) + ' A' + q + ',' + q + ' 0 0 1 ' + (x0 + w) + ',' + (y0 + q) + ' V' + (y0 + h - q) + ' A' + q + ',' + q + ' 0 0 1 ' + (x0 + w - q) + ',' + (y0 + h) + ' H' + (x0 + q) + ' A' + q + ',' + q + ' 0 0 1 ' + x0 + ',' + (y0 + h - q) + ' Z',
          class: 'obj'
        });
      }

      at(2.6, 0.08, 0.7);
      const RCX = RX + EW / 2;
      mk('line', { x1: X(RCX), y1: Y(EY - 25), x2: X(RCX), y2: Y(EY + EH + 25), class: 'cl' });
      mk('line', { x1: X(RX - 25), y1: Y(CCY), x2: X(RX + EW + 25), y2: Y(CCY), class: 'cl' });
      for (let y = EY + 24; y < EY + EH - 20; y += 24) {
        mk('line', { x1: X(RX + 14), y1: Y(y), x2: X(RX + EW - 14), y2: Y(y), class: 'thin', opacity: .45 });
      }

      at(3.1, 0.06, 0.5);
      dimH(X(LX + EW), X(RX), ty, Y(EY), Y(EY), 'S_inter = 160');
      dimH(X(RX), X(RX + EW), ty, null, Y(EY), 'W_eye = 240');
      dimH(X(LCX), X(RCX), Y(EY - 56), Y(EY - 25), Y(EY - 25), 'P_eyes · optical-pitch = 400');
      dimH(X(LX), X(RX + EW), Y(EY - 84), Y(EY - 25), Y(EY - 25), 'W_total = 640');

      at(3.6, 0.05, 0.6);
      rr(X(0), Y(0), CW * k, CH * k, 0, 'border');
      dimH(X(0), X(LX), ty, Y(0), Y(EY), 'M_side = 280', { dx: -8 });
      dimH(X(RX + EW), X(CW), ty, null, Y(0), 'M_side = 280', { dx: 8 });
      dimV(Y(0), Y(EY), X(-65), X(0), X(LX), 'M_vert = 180');
      dimV(Y(EY + EH), Y(CH), X(-65), null, X(0), 'M_vert = 180');
      dimV(Y(0), Y(CH), X(-98), X(-70), X(-70), 'H_canvas = 600');
      dimH(X(0), X(CW), Y(-112), Y(-30), Y(-30), 'W_canvas · logical-width = 1200');

      at(4.1, 0.05, 0.45);
      mk('line', { x1: X(LX), y1: Y(CCY), x2: X(LX + EW), y2: Y(CCY), class: 'ph' });
      mk('line', { x1: X(RX), y1: Y(CCY), x2: X(RX + EW), y2: Y(CCY), class: 'ph' });
      slotLabel(X(LX), Y(CCY - 10), EW * k, 0, 'Blink closed squash line (H=0)');
      slotLabel(X(RX), Y(CCY - 10), EW * k, 0, 'Blink closed squash line (H=0)');
      nb(X(LCX), Y(EY + 38), 2);
      nb(X(RCX), Y(EY + 38), 2);
      nb(X((LX + EW + RX) / 2), Y(CCY), 3);
      detailRef(X(LX + 20), Y(EY + 60), 26 * k, 'DETAIL A', X(LX - 60), Y(EY + 15));
      detailRef(X(LX), Y(EY), 20 * k, 'DETAIL B', X(LX - 60), Y(EY + 120));
      detailRef(X(RCX), Y(CCY), 30 * k, 'DETAIL C', X(RCX + 130), Y(CCY - 30));
      title(X(CW / 2), Y(CH + 38), 'Plan view · dual particle eye geometry', 'Scale 0.58:1 · pitch P = 400 · bounding span = 640 · uniform sampling step 5×8');

      /* ---------- BEAT 3: EXPLODED LAYERS LIFT (4.2 to 7.2s) ---------- */
      const sc = 0.40, TX = 270, TY = 620, gap = 44;
      const ia = 0.94 * sc, ib = 0.17 * sc, ic = -0.34 * sc, id = 0.47 * sc;
      const P = (x, y, z) => [TX + ia * x + ic * y, TY + ib * x + id * y - z];
      const uIso = 1 / Math.sqrt(ia * id - ib * ic);
      const G = z => {
        const g = mk('g', { transform: 'matrix(' + ia + ',' + ib + ',' + ic + ',' + id + ',' + TX + ',' + (TY - z) + ')' });
        g.style.setProperty('--u', uIso);
        return g;
      };

      at(5.4, 0.1, 0.8);
      let g = G(0);
      rr(-20, -20, 600, 320, 0, 'thin', g);
      g = G(gap);
      rr(80, 40, 160, 160, 16, 'hs', g);
      rr(320, 40, 160, 160, 16, 'hs', g);

      noreg = 1;
      const MG = this.morph = [];
      const mg = (z, a0) => {
        const g2 = mk('g', {});
        g2.style.opacity = 0;
        MG.push({ g: g2, z: z, a: a0 });
        return g2;
      };

      let q = mg(gap * 2, 5.5);
      rr(80, 40, 160, 160, 26, 'obj', q);
      rr(320, 40, 160, 160, 26, 'obj', q);

      q = mg(gap * 3, 5.65);
      rr(84, 52, 156, 146, 24, 'well', q);
      rr(320, 52, 156, 146, 24, 'well', q);

      q = mg(gap * 4, 5.8);
      rr(84, 52, 156, 146, 24, 'slot', q);
      rr(320, 52, 156, 146, 24, 'slot', q);

      noreg = 0;
      this.iso = [ia, ib, ic, id, TX, TY];
      this.flat = [k, 0, 0, k, PX, PY];
      this.uIso = uIso;
      this.uFlat = 1 / k;

      at(6.7, 0.04, 0.45);
      [[0, 0], [560, 0], [560, 280], [0, 280]].forEach(([x, y]) => {
        const p1 = P(x, y, gap * 0.8), p2 = P(x, y, gap * 4.2);
        mk('line', { x1: p1[0], y1: p1[1], x2: p2[0], y2: p2[1], class: 'ph' });
      });

      at(6.9, 0.07, 0.45);
      const ELX = 50;
      [
        [0, [-15, 275], 'L0 · Canvas Plane', '1200×600 logical boundary'],
        [gap, [80, 200], 'L1 · Scanline Matrix', '5×8 sampling cells'],
        [gap * 2, [80, 200], 'L2 · Eye Apertures', 'Dual 240×240 rounded rects (R=40)'],
        [gap * 3, [84, 200], 'L3 · Kinematics', '±3.44° Cozmo tilt & +34px look-down'],
        [gap * 4, [84, 200], 'L4 · Particle Dots', '~2,810 vector dots (Z=1.8–2.8)']
      ].forEach(([z, [x, y], t, st]) => {
        const p1 = P(x, y, z);
        mk('circle', { cx: p1[0], cy: p1[1], r: 1.8, class: 'dot' });
        mk('polyline', { points: p1[0] + ',' + p1[1] + ' ' + (ELX + 180) + ',' + p1[1] + ' ' + (ELX + 170) + ',' + p1[1], class: 'lead' });
        tx(ELX + 165, p1[1] - 2, t, 'vt', { 'text-anchor': 'end' });
        tx(ELX + 165, p1[1] + 10, st, 'dts', { 'text-anchor': 'end' });
      });
      title(260, TY + 140, 'Exploded view · particle eye stack', 'Axonometric projection · z-spacing not to scale');

      /* ---------- BEAT 4: PULL-BACK TO FULL SHEET & DETAIL VIEWS (7.2 to 9.2s) ---------- */
      at(7.7, 0, 1.6);
      rr(20, 20, 1860, 1020, 16, 'border');

      at(8.4, 0.04, 0.4);
      notes([
        [1, 'Logical canvas 1200×600 (2:1). Scale min(W/1200, H/600)·0.82.'],
        [2, 'Dual eye apertures: W=240, H=240, corner radius R=40.'],
        [3, 'Optical centers: CX=400/800; CY=300; pitch P_eyes=400.'],
        [4, 'Scanline matrix sampled at step-x=5, step-y=8.'],
        [5, 'Particle count ~2,810 (1,405 per eye); diameter Z=1.8–2.8.'],
        [6, 'Idle breathing range X=±0.6, Y=±0.4; blink duration 20 frames.'],
        [7, 'Typing state applies inquisitive tilt A_tilt = ±3.44°.'],
        [8, 'Gaze locks downward D_look_dn = +34px with ±12px convergence.']
      ]);

      at(8.8, 0.006, 0.25);
      let yy = table(1580, 86, 'Eye Geometry', [
        ['W_canvas', 'logical-canvas-w', '1200'],
        ['H_canvas', 'logical-canvas-h', '600'],
        ['W_eye', 'eye-aperture-w', '240'],
        ['H_eye', 'eye-aperture-h', '240'],
        ['R_eye', 'corner-radius', '40'],
        ['S_inter', 'inter-ocular-gap', '160'],
        ['P_eyes', 'optical-pitch', '400'],
        ['W_total', 'bounding-span', '640']
      ]);
      yy = table(1580, yy, 'Scanline & Sampling', [
        ['STEP_X', 'scan-h-step', '5'],
        ['STEP_Y', 'scan-v-height', '8'],
        ['Z_dot', 'particle-diam', '1.8–2.8'],
        ['N_eye', 'dots-per-eye', '≈ 1405'],
        ['N_total', 'total-particles', '≈ 2810']
      ]);
      yy = table(1580, yy, 'Kinematics & States', [
        ['T_blink', 'blink-duration', '20 frames'],
        ['D_shift_x', 'max-gaze-x', '±20'],
        ['D_look_dn', 'typing-look-down', '+34'],
        ['A_tilt', 'inquisitive-tilt', '±3.44°']
      ]);

      // Detail A: 5x8 Scanline Dot Matrix Sampling
      {
        const DA_X = 520, DA_Y = 660, DA_K = 3.6;
        at(9.0, 0.05, 0.45);
        rr(DA_X, DA_Y, 70 * DA_K, 40 * DA_K, 0, 'obj');
        for (let x = 0; x <= 70; x += 10) {
          mk('line', { x1: DA_X + x * DA_K, y1: DA_Y, x2: DA_X + x * DA_K, y2: DA_Y + 40 * DA_K, class: 'thin', opacity: .4 });
        }
        for (let y = 0; y <= 40; y += 16) {
          mk('line', { x1: DA_X, y1: DA_Y + y * DA_K, x2: DA_X + 70 * DA_K, y2: DA_Y + y * DA_K, class: 'thin', opacity: .4 });
        }
        for (let y = 8; y < 40; y += 16) {
          for (let x = 5; x < 70; x += 10) {
            mk('circle', { cx: DA_X + x * DA_K, cy: DA_Y + y * DA_K, r: 2.3 * DA_K / 1.8, class: 'dot' });
          }
        }
        dimH(DA_X + 10 * DA_K, DA_X + 20 * DA_K, DA_Y + 40 * DA_K + 18, DA_Y + 40 * DA_K, DA_Y + 24 * DA_K, 'STEP_X = 5', { below: true });
        dimV(DA_Y, DA_Y + 16 * DA_K, DA_X - 14, DA_X, DA_X + 10 * DA_K, 'STEP_Y = 8', { side: 'l' });
        title(DA_X + 35 * DA_K, DA_Y + 40 * DA_K + 48, 'Detail A · 5×8 scanline sampling', 'Scale 3.6:1');
      }

      // Detail B: Corner Fillet Geometry & Tangency
      {
        const DB_X = 940, DB_Y = 660, DB_K = 2.0, R = 40;
        at(9.3, 0.05, 0.45);
        mk('path', {
          d: 'M' + DB_X + ',' + (DB_Y + 70 * DB_K) + ' L' + DB_X + ',' + (DB_Y + R * DB_K) + ' A' + (R * DB_K) + ',' + (R * DB_K) + ' 0 0 1 ' + (DB_X + R * DB_K) + ',' + DB_Y + ' L' + (DB_X + 70 * DB_K) + ',' + DB_Y,
          class: 'obj', fill: 'none'
        });
        const CCX = DB_X + R * DB_K, CCY = DB_Y + R * DB_K;
        mk('line', { x1: CCX, y1: CCY, x2: CCX - R * DB_K * 0.707, y2: CCY - R * DB_K * 0.707, class: 'dl', 'marker-end': A });
        tx(CCX - 24, CCY - 24, 'R_eye = 40', 'dt');
        title(DB_X + 35 * DB_K, DB_Y + 70 * DB_K + 34, 'Detail B · corner fillet G1', 'Scale 2.0:1');
      }

      // Detail C: Tilt & Look-Down Vector Kinematics
      {
        const DC_X = 1220, DC_Y = 650, DC_K = 0.78;
        at(9.6, 0.05, 0.45);
        mk('rect', { x: DC_X, y: DC_Y, width: 240 * DC_K, height: 240 * DC_K, rx: 40 * DC_K, class: 'obj' });
        mk('line', { x1: DC_X + 120 * DC_K, y1: DC_Y - 15, x2: DC_X + 120 * DC_K, y2: DC_Y + 255 * DC_K, class: 'cl' });
        mk('line', { x1: DC_X + 120 * DC_K, y1: DC_Y + 120 * DC_K, x2: DC_X + 120 * DC_K, y2: DC_Y + 120 * DC_K + 34, class: 'dl', 'marker-end': A });
        tx(DC_X + 120 * DC_K + 10, DC_Y + 120 * DC_K + 22, '+34 look-down', 'dts');
        tx(DC_X + 120 * DC_K - 24, DC_Y - 18, 'A_tilt = −3.44°', 'dt');
        title(DC_X + 120 * DC_K, DC_Y + 240 * DC_K + 44, 'Detail C · typing tilt & gaze', 'Scale 0.78:1');
      }
    },

    render(t) {
      t = t / 0.85;
      let i = 0;
      while (i < DW_CAM.length - 2 && t > DW_CAM[i + 1].t) i++;
      const c0 = DW_CAM[i], c1 = DW_CAM[i + 1], p = eio(seg(t, c0.t, c1.t));
      const z = Math.exp(lerp(Math.log(c0.z), Math.log(c1.z), p));
      const cx = lerp(c0.cx, c1.cx, p);
      const cy = lerp(c0.cy, c1.cy, p);
      this.cam.transform = 'translate(' + (960 - cx * z) + 'px,' + (540 - cy * z) + 'px) scale(' + z + ')';

      for (const it of this.reg) {
        let v = clamp01((t - it.a) / (it.b - it.a));
        v = Math.round(v * 400) / 400;
        if (v === it.last) continue;
        it.last = v;
        const s = it.e.style;
        if (it.k === 'f') {
          s.opacity = eo(v);
          continue;
        }
        const e = eio(v);
        s.opacity = Math.min(1, v * 6);
        if (v >= 1) {
          s.strokeDasharray = '';
          s.strokeDashoffset = '';
        } else {
          s.strokeDasharray = '1 2';
          s.strokeDashoffset = 1 - e;
        }
        s.fillOpacity = eo(seg(v, .55, 1));
      }

      const F = this.flat, I = this.iso;
      this.morph.forEach((m) => {
        const v = eio(seg(t, m.a, m.a + 1.5));
        const M = F.map((f, n) => lerp(f, I[n], v));
        M[5] -= m.z * v;
        m.g.style.opacity = eo(seg(t, m.a + 0.05, m.a + 0.5));
        const fo = eo(seg(t, m.a + 0.55, m.a + 1.25));
        if (fo !== m.fo) {
          m.fo = fo;
          m.fills = m.fills || m.g.querySelectorAll('.obj,.well,.hug');
          m.fills.forEach(e => { e.style.fillOpacity = fo; });
        }
        m.g.setAttribute('transform', 'matrix(' + M.join(',') + ')');
        m.g.style.setProperty('--u', 1 / Math.sqrt(Math.abs(M[0] * M[3] - M[1] * M[2])));
      });
    }
  });

  window.SC.init(kit);
  window.R = t => window.SC.render(t, kit);

  let currentTime = 0;
  let isPlaying = true;
  let playbackRate = 1.0;
  let lastFrameTime = performance.now();

  const btnPlay = document.getElementById('btn-play');
  const playIcon = document.getElementById('play-icon');
  const playText = document.getElementById('play-text');
  const btnRestart = document.getElementById('btn-restart');
  const btnSpeed = document.getElementById('btn-speed');
  const scrubber = document.getElementById('scrubber');
  const timeDisplay = document.getElementById('time-display');
  const beatLabel = document.getElementById('beat-label');

  const speeds = [0.5, 1.0, 1.5, 2.0];
  let speedIdx = 1;

  btnSpeed.addEventListener('click', () => {
    speedIdx = (speedIdx + 1) % speeds.length;
    playbackRate = speeds[speedIdx];
    btnSpeed.textContent = playbackRate.toFixed(1) + '×';
  });

  btnPlay.addEventListener('click', () => {
    isPlaying = !isPlaying;
    updatePlayBtn();
    if (isPlaying) lastFrameTime = performance.now();
  });

  btnRestart.addEventListener('click', () => {
    currentTime = 0;
    window.R(0);
    updateUI();
  });

  scrubber.addEventListener('input', (e) => {
    currentTime = parseFloat(e.target.value);
    window.R(currentTime);
    updateUI();
  });

  function updatePlayBtn() {
    if (isPlaying) {
      playIcon.textContent = '❚❚';
      playText.textContent = 'PAUSE';
    } else {
      playIcon.textContent = '▶';
      playText.textContent = 'PLAY';
    }
  }

  function getBeatDescription(t) {
    if (t < 2.2) return 'BEAT 1 · LEFT EYE APERTURE & SCANLINES';
    if (t < 4.2) return 'BEAT 2 · DUAL EYE PLAN & SQUASH ENVELOPE';
    if (t < 7.2) return 'BEAT 3 · 3D AXONOMETRIC LAYERS LIFT';
    if (t < 9.2) return 'BEAT 4 · FULL SHEET PULL-BACK & DETAILS';
    return 'BEAT 5 · RESOLVED SPEC SHEET HOLD';
  }

  function updateUI() {
    scrubber.value = currentTime;
    timeDisplay.textContent = currentTime.toFixed(1) + 's';
    beatLabel.textContent = getBeatDescription(currentTime);
  }

  function loop(now) {
    const dt = (now - lastFrameTime) / 1000;
    lastFrameTime = now;

    if (isPlaying) {
      currentTime += dt * playbackRate;
      if (currentTime > 11.0) {
        currentTime = 0;
      }
      window.R(currentTime);
      updateUI();
    }
    requestAnimationFrame(loop);
  }

  // Keyboard controls
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      isPlaying = !isPlaying;
      updatePlayBtn();
      if (isPlaying) lastFrameTime = performance.now();
    } else if (e.code === 'ArrowRight') {
      currentTime = Math.min(11.0, currentTime + 0.1);
      window.R(currentTime);
      updateUI();
    } else if (e.code === 'ArrowLeft') {
      currentTime = Math.max(0, currentTime - 0.1);
      window.R(currentTime);
      updateUI();
    } else if (e.code === 'KeyR') {
      currentTime = 0;
      window.R(0);
      updateUI();
    }
  });

  window.R(0);
  updatePlayBtn();
  updateUI();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
